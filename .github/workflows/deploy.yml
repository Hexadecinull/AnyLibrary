name: Deploy to InfinityFree

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          missing=()
          [ -z "${{ secrets.FTP_HOST }}"     ] && missing+=("FTP_HOST")
          [ -z "${{ secrets.FTP_USERNAME }}" ] && missing+=("FTP_USERNAME")
          [ -z "${{ secrets.FTP_PASSWORD }}" ] && missing+=("FTP_PASSWORD")
          [ -z "${{ secrets.DB_HOST }}"      ] && missing+=("DB_HOST")
          [ -z "${{ secrets.DB_NAME }}"      ] && missing+=("DB_NAME")
          [ -z "${{ secrets.DB_USER }}"      ] && missing+=("DB_USER")
          [ -z "${{ secrets.DB_PASS }}"      ] && missing+=("DB_PASS")
          [ -z "${{ secrets.JWT_SECRET }}"   ] && missing+=("JWT_SECRET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All secrets present"

      - name: Write config.php from secrets
        env:
          DB_HOST:    ${{ secrets.DB_HOST }}
          DB_NAME:    ${{ secrets.DB_NAME }}
          DB_USER:    ${{ secrets.DB_USER }}
          DB_PASS:    ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          {
            printf '<?php\n'
            printf '// AnyLibrary - Free, open-source book library (GPL-3.0)\n'
            printf '// Auto-generated by CI - do not commit this file.\n'
            printf "define('DB_HOST',             '%s');\n" "$DB_HOST"
            printf "define('DB_NAME',             '%s');\n" "$DB_NAME"
            printf "define('DB_USER',             '%s');\n" "$DB_USER"
            printf "define('DB_PASS',             '%s');\n" "$DB_PASS"
            printf "define('JWT_SECRET',          '%s');\n" "$JWT_SECRET"
            printf "define('OL_LANG',             'en');\n"
            printf "define('MANGADEX_USER',       '');\n"
            printf "define('MANGADEX_PASS',       '');\n"
            printf "define('APP_URL',             'https://anylibrary.ct.ws');\n"
            printf "define('APP_ENV',             'production');\n"
            printf "define('MAX_IMPORT_MB',       50);\n"
            printf "define('ALLOWED_IMPORT_EXTS', ['epub','pdf','mobi','txt','html','htm','cbz','cbr']);\n"
            printf "define('IMPORT_STORAGE_PATH', __DIR__ . '/../storage/books/');\n"
            printf "define('GUEST_TOKEN_HEADER',  'HTTP_X_GUEST_TOKEN');\n"
          } > includes/config.php

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          local-dir:   ./
          server-dir:  /anylibrary.ct.ws/htdocs/
          protocol:    ftp
          port:        21
          timeout:     60000
          log-level:   minimal
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/vendor/**
            .gitignore
            .gitattributes
            eslint.config.mjs
            composer.json
            composer.lock
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CHANGELOG.md
            LICENSE
            docs/**
